with them?","How does it change across every surface without losing itself?","What do we learn from the first thousand views?"]},{slug:"brands",n:"02",title:"Brands",kicker:"Identities that behave",line:"A mark is no longer a static thing. We design identities that move, respond and hold together.",visual:"mark",discipline:"Identity & brand systems",idea:"Most brands now live in motion, at a thousand sizes, generated faster than any team can hand-craft. So we design the behaviour of a brand, not just its appearance.",system:"Rules before pixels: typography, proportion, motion and generative constraints that let a brand produce itself \u2014 and still be recognisable at a glance.",questions:["What never changes?","What is allowed to change, and how much?","How does the brand sound when it speaks at scale?"]},{slug:"cultural-objects",n:"03",title:"Cultural objects",kicker:"Things without a category",line:"Films, prints, installations and artefacts that exist because they are worth looking at.",visual:"terrain",discipline:"Objects, film & installation",idea:"Some of the most useful things a studio makes don't fit a brief. Objects that start conversations, landscapes that were never photographed, films made from data.",system:"Small teams, long looks, custom tools. Every object gets its own rendering technique rather than a house style.",questions:["Would anyone stop for this?","Does it reward a second look?","What does it make possible next?"]},{slug:"content-systems",n:"04",title:"Content systems",kicker:"Engines for brands",line:"We built a media company that creates while we sleep. We can build yours.",visual:"globe",discipline:"AI-native content systems",idea:"AIX is our proof. The same engine that runs our own media network \u2014 observing culture, making, checking, publishing and learning \u2014 can be shaped around a brand's voice and standards.",system:"A custom content engine: cultural listening, generation, quality control, packaging and distribution, with a feedback loop that makes every cycle better than the last.",questions:["What should your brand be saying every day?","Who decides what is good enough?","What should the system learn first?"]}],Zi=[{n:"004",title:"Data blooms",kind:"blooms",line:"Flowers that grow from numbers."},{n:"007",title:"Synthetic nature",kind:"nature",line:"Branches that follow rules we didn't write."},{n:"011",title:"Digital species",kind:"species",line:"Something that follows you. Gently."},{n:"013",title:"Other realities",kind:"realities",line:"A sky made of everything else."}],Wt=[{slug:"on-attention",date:"SEP 25",iso:"2026-09-25",title:"On attention",dek:"The scarcest material we work with.",body:["Everything we make competes with everything else anyone could be looking at. That is the brief behind every brief.","Attention can be interrupted, but it cannot be forced to stay. The work that holds it has something in common: it rewards the second look. There is more there than the first glance promised.","So we design in layers. An image that reads instantly from across a room, and a structure that keeps revealing itself up close. A flower, then the marks that make it, then the numbers inside the marks.","When people want to keep looking, you no longer have to shout."]},{slug:"ai-x-culture",date:"SEP 21",iso:"2026-09-21",title:"AI \xD7 Culture",dek:"The tool is new. The job is not.",body:["Every new medium arrives with a period in which the medium itself is the message. Early photography photographed photography. Early web design designed the web.","We think that period is ending for AI. The interesting question is no longer what the tool can do but what is worth making with it.","Culture has never cared how something was made, only whether it was worth attention. Taste, judgement and point of view are still the scarce ingredients. The technology changes the cost of making, not the value of meaning.","Would it still be interesting if the word AI disappeared? That is our test for everything."]},{slug:"building-aix",date:"SEP 17",iso:"2026-09-17",title:"Building AIX",dek:"A media company that makes things while we sleep.",body:["AIX started as a question: could a small studio run a media network the way a large one does, if the system did the repetitive parts?","The answer became an engine with eight movements \u2014 observe, think, make, check, package, distribute, measure, learn \u2014 and a loop that joins the last to the first.","The hard part was never generation. It was judgement: deciding what is good enough, what is on-voice, what should never be published. Most of our engineering went into the checks, not the making.","AIX is still learning. That is the point of it."]},{slug:"creative-systems",date:"SEP 12",iso:"2026-09-12",title:"Creative systems",dek:"Designing the thing that designs the thing.",body:["A creative system is a set of decisions made once so that thousands of good decisions can follow.","Brand guidelines were an early version: a document describing a system that people then executed by hand. Now the system can execute itself, which means the rules have to be precise enough to run.","That changes what designers do. Less arranging, more authoring. Less output, more intent. The craft moves upstream."]},{slug:"a-more-interesting-tomorrow",date:"SEP 08",iso:"2026-09-08",title:"A more interesting tomorrow",dek:"Not a better one. A more interesting one.",body:["Futures promised by technology companies tend to be smooth, efficient and oddly empty. We would rather aim for interesting.","Interesting is harder to optimise. It needs friction, surprise, a point of view, the occasional bad idea that turns out to be a good one.","Same ideas. Different perspectives. That is where most new things come from \u2014 not from new ingredients, but from looking at the old ones from somewhere else."]}],Yu=[{slug:"aix",n:"01",title:"AIX",kicker:"Media network",line:"A media company that creates while we sleep. Ten properties, one content engine.",href
